<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Luxe Store</title>
    <link rel="stylesheet" href="css/style3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>

<body>
    <header>
        <h1>LUXE STORE</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <section class="checkout-section" onsubmit="placeholder(event)">
        <h2>Checkout</h2>

        <form class="checkout-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <br>
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number" required>
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email address" required>
            <br>
            <label for="address">Delivery Address</label>
            <textarea id="address" placeholder="Enter your delivery address" required></textarea>
            <br>

            <h3>Payment Method</h3>
            <div class="payment-method">
                <label>
                    <input type="radio" name="payment" value="cash">
                    Cash on Delivery
                </label>
                <label>
                    <input type="radio" name="payment" value="transfer">
                    Bank Transfer
                </label>
            </div>
            <br>
            <button type="submit">Place Order</button>
        </form>
    </section>

    
    <footer class="footer">
        <div class="footer-content">

            <div class="footer-brand">
                <h2>LUXE STORE</h2>
                <p>Simple. Elegant. Made for you.</p>
            </div>

            <div class="footer-links">
                <h3>Quick Links</h3>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="cart.html">Cart</a>
            </div>

            <div class="footer-contact">
                <h3>Contact Us</h3>
                <p>Email: luxestore@gmail.com</p>
                <p>phone: +234 9138644636</p>
            </div>
        </div>

        <div class="footer-bottom">
            <p>@ 2026 LUXE STORE. All rights reserved.</p>
        </div>

         <div class="footer-icon">
            <i class="fa-brands fa-whatsapp"></i>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-tiktok"></i>
            <i class="fa-brands fa-youtube"></i>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
